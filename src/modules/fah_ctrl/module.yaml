        type: float
        units: kg
        min: 0.1
        max: 5.0
        reboot_required: true
        default: 1.5

      FAH_I_XX:
        description:
          short: Inertia of the vehicle over the x-axis
          long: |
            Inertia of the vehicle over the x-axis, based on the Solidworks design.
        type: float
        units: kg
        min: 0.00
        max: 1.00
        reboot_required: true
        default: 0.03
        
      FAH_I_YY:
