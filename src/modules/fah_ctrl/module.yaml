module_name: FAH_CTRL
parameters:
  - group: FAH_CTRL
    definitions:
      FAH_X_P:
        description:
          short: P Gain for x-axis
          long: |
            P Gain for the x-axis fo the FAH, based on a Nonlinear PD controller with gravity compensation.
        type: float
        units: ms
        min: 0.0
        max: 50.0
        reboot_required: true
        default: 2.5
      
      FAH_X_D:
