        type: float
        units: kg
        min: 0.00
        max: 1.00
        reboot_required: true
        default: 0.05
        
      FAH_ALT_DES:
        description:
          short: Desired Altitude
          long: |
            Desired z-axis value for the FAH, can be used to set the altitude via the TRAJ_SEL All zeros option
        type: float
        units: m
        min: 0.00
        max: 2.50
        reboot_required: true
        default: 0.0
      
      FAH_X_DES:
        description:
          short: Desired X Position
          long: |
            Desired x-axis value for the FAH, can be used to set the altitude via the TRAJ_SEL All zeros option
        type: float
        units: m
        min: -2.50
        max: 2.50
        reboot_required: true
        default: 0.0
      
      FAH_Y_DES:
        description:
          short: Desired Y Position
          long: |
            Desired y-axis value for the FAH, can be used to set the altitude via the TRAJ_SEL All zeros option
        type: float
        units: m
        min: -2.50
        max: 2.50
        reboot_required: true
        default: 0.0
        
      TRAJ_SEL:
        description:
          short: Trajectory source selector
          long: |
            Desired trajectory selector for FAH. Options 0 - All zeros. 1 - Polynomial trajectory. 2 - Helicoidal trajectory.
        type: enum
        values:
          0: 0
          1: 1
          2: 2
          3: 3
          4: 4
        default: 0
        
      CTRL_SEL:
        description:
          short: Control Selector
          long: |
            Controller Selector for the FAH, be careful to select an appropiate estimator if using an obsever-based controller. Options 0 - PD. 1 - ASGSM. 2 - Quaternion ASGSM.
        type: enum
        values:
          0: 0
          1: 1
          2: 2
        default: 0
