module_name: FAH_OBS
parameters:
  - group: FAH_OBS
    definitions:
      FAH_SOF_X:
        description:
          short: SOF Gain for x-axis
          long: |
            SOF Gain for the x-axis of the FAH, part of a stabilization or control algorithm.
        type: float
        units: ms
        min: 0.0
        max: 50.0
        reboot_required: true
        default: 30.0
