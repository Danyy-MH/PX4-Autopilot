module_name: FAH_OBS
parameters:
  - group: FAH_FXTD
    definitions:
      X_G1:
        description:
          short: Observer parameter G1 for X state.
          long: |
            Defines the observer gain G1 for the X state, ensuring stability and convergence.
            G1 is a tuning parameter.
        type: float
        min: 0.0
        max: 20.0
        reboot_required: true
        default: 5.0

      X_G2:
        description:
          short: Observer parameter G2 for X state.
          long: |
            Defines the observer gain G2 for the X state, ensuring stability and performance.
            G2 is a tuning parameter.
        type: float
        min: 0.0
        max: 20.0
        reboot_required: true
        default: 6.0

      X_VPI:
        description:
          short: Observer parameter VPI for X state.
          long: |
            Defines the lambda parameter for the observer, influencing the convergence rate.
            VPI helps to manage the convergence time and the noise sensitivity.
        type: float
        min: 0.0
        max: 20.0
        reboot_required: true
        default: 0.6

      X_VRHO:
        description:
          short: Observer parameter VRHO for X state.
          long: |
            Defines the VRHO parameter for robustness against disturbances in the X state.
            VRHO influences the transitory of the estimation error.
        type: float
        min: 0.0
        max: 20.0
        reboot_required: true
        default: 1.2

