module_name: FAH_OBS
parameters:
  - group: FAH_FXTESO
    definitions:
      X_MU1:
        description:
          short: Observer parameter MU1 for X state.
          long: |
            Defines the observer gain MU1 for the estimated X state, ensuring stability and performance.
            MU1 is a tuning parameter for the estimation process.
        type: float
        min: 0.0
        max: 500.0
        reboot_required: true
        default: 16.0

      X_MU2:
        description:
          short: Observer parameter MU2 for X state.
          long: |
            Defines the observer gain MU2 for the estimated X state, influencing system response.
            MU2 is a tuning parameter for the estimation process.
        type: float
        min: 0.0
        max: 500.0
        reboot_required: true
        default: 150.0

      X_MU3:
        description:
          short: Observer parameter MU3 for X state.
          long: |
            Defines the observer gain MU3 for the estimated X state, affecting dynamic performance.
            MU3 is a tuning parameter for the estimation process.
        type: float
        min: 0.0
        max: 500.0
        reboot_required: true
        default: 450.0

      X_MU4:
        description:
          short: Observer parameter MU4 for X state.
          long: |
            Defines the observer gain MU4 for the estimated X state, affecting fine-tuning of the system.
            MU4 is a tuning parameter for the estimation process and should be small enough.
        type: float
        min: 0.0
        max: 1.0
        reboot_required: true
        default: 0.01

      X_ALPHA:
        description:
          short: Observer parameter ALPHA for X state.
          long: |
            Defines the lambda parameter for the observer, influencing the convergence rate.
            ALPHA helps to manage the convergence time and the noise sensitivity.
        type: float
        min: 0.0
        max: 20.0
        reboot_required: true
        default: 0.6

      X_BETA:
        description:
          short: Observer parameter BETA for X state.
          long: |
            Defines the BETA parameter for robustness against disturbances in the X state.
            BETA influences the transitory of the estimation error.
        type: float
        min: 0.0
        max: 20.0
        reboot_required: true
        default: 1.2

